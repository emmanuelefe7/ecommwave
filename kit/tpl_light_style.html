<!doctype html><html><head><meta charset="utf-8">
<!-- LIGHT STYLE template (owner's reference: ref/light_style.jpg). Light blue-grey bg, navy slanted label blocks,
     mint "&"/accents, mint + grey rings, dot grid, stacked navy gradient cards with mint icon circles.
     Carousel: render with tools/render_carousel.py (one JPEG per <section class="s">). For videos, copy the
     .lt-* classes into a 1080x1920 page. -->
<link rel="stylesheet" href="common.css">
<style>
:root{--lbg:#e6ecf7;--lnavy:#152a59;--lcard1:#3356b0;--lcard2:#162a5c;--lmint:#4fd1a0;--lring:#acb7cb;--ltext:#14254f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Inter Display","Inter",sans-serif;-webkit-font-smoothing:antialiased}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:20px}
.lt{background:radial-gradient(520px 380px at 50% 46%,#ffffff 0%,rgba(255,255,255,0) 70%),radial-gradient(500px 260px at 50% 40%,rgba(79,209,160,.16),rgba(79,209,160,0) 70%),var(--lbg);color:var(--ltext)}
/* decorations */
.ring{position:absolute;border-radius:50%;border-style:solid}
.ring.m{border-color:var(--lmint);opacity:.75}
.ring.g{border-color:var(--lring)}
.ring.blur{filter:blur(2px)}
.dots{position:absolute;width:90px;height:150px;background-image:radial-gradient(#c8d1e0 3.5px,transparent 4px);background-size:30px 30px}
/* headline */
.lt-kick{position:absolute;left:0;right:0;top:80px;text-align:center;font:800 50px "Inter Display";letter-spacing:-.02em;color:var(--ltext)}
.slab{position:absolute;background:var(--lnavy);color:#fff;font:900 96px "Inter Display";letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);text-transform:uppercase}
.amp{position:absolute;font:900 120px "Inter Display";color:var(--lmint)}
/* stacked cards */
.stack{position:absolute;left:230px;width:600px}
.lc{position:relative;height:110px;border-radius:24px;background:linear-gradient(90deg,var(--lcard1),var(--lcard2));box-shadow:0 18px 34px rgba(21,42,89,.28),inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;gap:22px;padding:0 26px;color:#fff;margin-bottom:-6px}
.lc .ic{width:62px;height:62px;border-radius:50%;background:var(--lmint);display:grid;place-items:center;flex:none}
.lc b{display:block;font:800 30px "Inter Display";letter-spacing:-.01em}
.lc span{display:block;font:500 20px Inter;color:rgba(255,255,255,.85);margin-top:4px}
.foot{position:absolute;left:70px;right:70px;bottom:60px;display:flex;justify-content:space-between;align-items:center}
.foot img{height:42px}
.foot span{font:800 30px "Inter Display";color:var(--ltext)}
.cta-l{background:var(--lnavy);color:#fff;font:800 40px "Inter Display";padding:24px 30px 24px 44px;border-radius:999px;display:inline-flex;gap:22px;align-items:center;box-shadow:0 20px 40px rgba(21,42,89,.3)}
.cta-l .arrow{width:60px;height:60px;border-radius:50%;background:var(--lmint);display:grid;place-items:center}
</style></head><body>
<section class="s lt" id="s1">
  <div class="ring m blur" style="left:40px;top:300px;width:150px;height:150px;border-width:24px"></div>
  <div class="ring g" style="right:70px;top:450px;width:120px;height:120px;border-width:18px"></div>
  <div class="ring m blur" style="left:-90px;top:950px;width:240px;height:240px;border-width:34px"></div>
  <div class="ring g blur" style="right:-10px;top:1000px;width:200px;height:200px;border-width:30px"></div>
  <div class="dots" style="left:38px;top:540px"></div>
  <div class="lt-kick">The difference between</div>
  <div class="slab" style="left:120px;top:150px;width:490px;height:116px">Traffic</div>
  <div class="amp" style="left:650px;top:140px">&amp;</div>
  <div class="slab" style="left:250px;top:285px;width:560px;height:116px">Revenue</div>
  <div class="stack" style="top:540px">
    <div class="lc" style="transform:rotate(2.5deg) translateY(-20px)"><div class="ic">I1</div><div><b>Paid Ads</b><span>Reach customers who are ready</span></div></div>
    <div class="lc"><div class="ic">I2</div><div><b>Email &amp; SMS</b><span>Bring customers back</span></div></div>
    <div class="lc" style="left:16px"><div class="ic">I3</div><div><b>SEO</b><span>Rank where shoppers search</span></div></div>
    <div class="lc" style="left:-10px"><div class="ic">I4</div><div><b>Conversion</b><span>Turn visitors into customers</span></div></div>
  </div>
  <div class="foot"><img src="assets/logo_navy.png"><span>ecommwave.org</span></div>
</section>
<script>
const ICON=d=>`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#152a59" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={I1:ICON('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'),I2:ICON('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 7l9 6 9-6"/>'),
I3:ICON('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'),I4:ICON('<path d="M4 16l6-6 4 4 6-6"/><path d="M15 8h5v5"/>')};
document.body.innerHTML=document.body.innerHTML.replace(/>(I\d)</g,(m,k)=>'>'+I[k]+'<');
</script>
</body></html>
