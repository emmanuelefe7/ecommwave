<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="light.css"><script src="light.js"></script>
<style>
/* LIGHT variant: editorial + graph paper + illustration card + tip tiles */
.gp{background:
  radial-gradient(520px 420px at 100% 0%,rgba(79,209,160,.22),rgba(79,209,160,0) 70%),
  radial-gradient(520px 420px at 0% 100%,rgba(51,86,176,.10),rgba(51,86,176,0) 70%),
  linear-gradient(#e2eaf4 1px,transparent 1px) 0 0/54px 54px,
  linear-gradient(90deg,#e2eaf4 1px,transparent 1px) 0 0/54px 54px,#f5f8fc}
.pill{border:2px solid rgba(18,184,134,.45);color:#0b8a63;background:#fff;font:700 21px Inter;letter-spacing:.14em;padding:11px 20px;border-radius:999px}
.H{position:absolute;left:80px;top:170px;width:920px;font:800 88px/1.02 "Inter Display";letter-spacing:-.045em;color:var(--ltext)}
.H em{font-family:Serif;font-style:italic;font-weight:400;color:var(--lgreen);letter-spacing:-.01em;font-size:1.1em}
.card{position:absolute;left:80px;top:400px;width:920px;height:520px;border-radius:44px;background:#fff;box-shadow:0 40px 90px rgba(21,42,89,.12);overflow:hidden}
.card .blob{position:absolute;left:470px;top:60px;width:420px;height:420px;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;background:#e3f8ef}
.card img{position:absolute;left:60px;top:40px;width:800px;height:440px;object-fit:contain}
.badge{position:absolute;background:var(--lnavy);color:#fff;font:700 22px Inter;padding:14px 22px;border-radius:999px;display:flex;gap:12px;align-items:center;box-shadow:0 16px 30px rgba(21,42,89,.25)}
.badge i{width:12px;height:12px;border-radius:50%;background:var(--lmint);display:block}
.tiles{position:absolute;left:80px;top:965px;width:920px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tile{background:#fff;border-radius:26px;padding:22px 24px;display:flex;gap:18px;align-items:center;box-shadow:0 14px 30px rgba(21,42,89,.08);border:1px solid #e6edf5}
.tile .k{width:54px;height:54px;border-radius:16px;background:var(--lnavy);color:var(--lmint);font:800 22px "Inter Display";display:grid;place-items:center;flex:none}
.tile b{display:block;font:800 27px "Inter Display";color:var(--ltext);letter-spacing:-.02em}
.tile span{display:block;font:500 19px Inter;color:var(--lmuted);margin-top:3px}
.bot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font:700 25px Inter;color:var(--ltext)}
.bot b{font:800 27px "Inter Display"}
</style></head><body>
<section class="s gp" id="s1">
  <div class="top"><img src="assets/logo_navy.png"><div class="pill">PRODUCT PHOTOS</div></div>
  <div class="H">Photos that make people <em>buy.</em></div>
  <div class="card"><div class="blob"></div><img src="assets/ill/product-photography.svg"></div>
  <div class="badge" style="left:600px;top:370px"><i></i>Shoppers can't touch it online</div>
  <div class="tiles">
    <div class="tile"><div class="k">01</div><div><b>Clean background</b><span>Nothing distracts from it</span></div></div>
    <div class="tile"><div class="k">02</div><div><b>Show it in use</b><span>Help them picture owning it</span></div></div>
    <div class="tile"><div class="k">03</div><div><b>Every angle</b><span>Front, back, side, inside</span></div></div>
    <div class="tile"><div class="k">04</div><div><b>Close-up details</b><span>Texture, size, quality</span></div></div>
  </div>
  <div class="bot"><span>DM us <b>“GROWTH”</b> for a free store audit</span><b>ecommwave.org</b></div>
</section>
</body></html>
