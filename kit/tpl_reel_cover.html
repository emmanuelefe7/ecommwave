<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body{width:auto!important;height:auto!important;overflow:visible!important;background:#777}
/* NAVY reel cover template: everything important sits in the centre 3:4 zone (y 240-1680) */
#cover{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter";
 background:radial-gradient(900px 800px at 100% 10%,#145466 0%,rgba(20,84,102,0) 70%),radial-gradient(900px 800px at 0% 95%,#173a80 0%,rgba(23,58,128,0) 70%),#0a1a47}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.6px,transparent 1.7px);background-size:36px 36px}
.kick{font:700 28px "Inter";letter-spacing:.16em;color:#34d5a0;text-transform:uppercase}
.hl{font:800 116px/1.0 "Inter Display";letter-spacing:-.045em;color:#fff;margin-top:22px}
.hl em{font-family:"Serif";font-style:italic;font-weight:400;color:#34d5a0;font-size:1.1em;letter-spacing:-.01em}
.play{position:absolute;display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;font:700 26px Inter;padding:12px 24px 12px 14px;border-radius:999px}
.play i{width:40px;height:40px;border-radius:50%;background:#34d5a0;display:grid;place-items:center}
</style></head><body>
<div id="cover"><div class="dots"></div>
  <img src="assets/logo_white.png" style="position:absolute;left:100px;top:340px;height:52px">
  <div style="position:absolute;left:100px;top:450px;width:880px">
    <div class="kick">Store owners, watch this</div>
    <div class="hl">Can customers spot your <em>Add to cart?</em></div>
  </div>
  <div style="position:absolute;left:520px;top:1010px;width:420px;height:520px">
    <div style="position:absolute;left:22px;top:22px;right:-22px;bottom:-22px;border-radius:210px 210px 30px 30px;background:#34d5a0"></div>
    <div style="position:absolute;inset:0;border-radius:210px 210px 30px 30px;overflow:hidden;background:#d9e3ef"><img src="assets/man.png" style="position:absolute;left:50%;bottom:0;height:560px;transform:translateX(-50%)"></div>
  </div>
  <div class="play" style="left:100px;top:1100px"><i><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#0a1a47"/></svg></i>Watch the fix</div>
  <div style="position:absolute;left:100px;top:1500px;font:700 28px Inter;color:rgba(255,255,255,.8)">ecommwave.org</div>
</div></body></html>
