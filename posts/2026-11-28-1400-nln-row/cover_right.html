<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../common.css">
<style>

@font-face{font-family:"Hand";src:url(../fonts/hand.woff2) format("woff2")}
:root{--ink:#0d1b3e;--mint:#34d5a0;--bad:#ff6b7a}
body{background:#0a1a47}
#stage{background:radial-gradient(760px 640px at 50% 42%,rgba(52,213,160,.16) 0%,rgba(52,213,160,0) 70%),radial-gradient(900px 700px at 100% 0%,#145466 0%,rgba(20,84,102,0) 70%),radial-gradient(800px 700px at 0% 100%,#11306b 0%,rgba(17,48,107,0) 70%),#0a1a47}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.7px);background-size:36px 36px}
.wave{position:absolute;left:0;width:1080px;opacity:.55}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 760px}
.phone{position:absolute;left:540px;top:760px;width:370px;height:760px;margin:-380px 0 0 -185px;border-radius:58px;background:#0b1020;padding:12px;
  box-shadow:0 50px 100px rgba(0,0,0,.45),0 0 0 2px #33406a,inset 0 0 0 2px #2b3448}
.scr{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#fff;font-family:Inter;color:#0f172a}
.isl{position:absolute;left:50%;top:11px;width:96px;height:28px;border-radius:16px;background:#000;transform:translateX(-50%);z-index:9}
.view{position:absolute;inset:0;background:#fff}
.sb{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font:600 15px Inter}
.bar{height:38px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 13.5px Inter;letter-spacing:.06em;color:#fff;background:#e5484d}
.bar b{font:800 15px "Inter Display";letter-spacing:.04em;background:rgba(0,0,0,.18);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.bar.ok{background:#0f1f4d;letter-spacing:.02em;font-size:13px}
.bar.ok i{width:9px;height:9px;border-radius:50%;background:#34d5a0;display:inline-block}
.nv{height:46px;display:flex;align-items:center;justify-content:center;font:800 19px "Inter Display";letter-spacing:.08em;color:#0f1f4d;position:relative}
.nv .mi{position:absolute;left:20px;top:15px;width:20px;height:14px;border-top:2.5px solid #0f1f4d;border-bottom:2.5px solid #0f1f4d}
.nv .mi:after{content:"";position:absolute;left:0;right:0;top:3.5px;border-top:2.5px solid #0f1f4d}
.nv .bag{position:absolute;right:20px;top:12px;width:20px;height:22px}
.pimg{margin:0 14px;height:200px;border-radius:18px;background:#e9e0d4;overflow:hidden;position:relative}
.pimg img{position:absolute;right:-110px;top:-6px;height:212px}
.pi{padding:14px 18px 0}
.t1 b{font:800 23px "Inter Display";letter-spacing:-.02em}
.st{font:500 13px Inter;color:#64748b;margin-top:4px}.st i{color:#f5b301;font-style:normal;letter-spacing:1px}
.pr{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.pr .now{font:800 26px "Inter Display";color:#e5484d}.pr s{font:600 17px Inter;color:#94a3b8}
.pr .tag{font:800 12px Inter;color:#fff;background:#e5484d;border-radius:6px;padding:4px 7px;letter-spacing:.04em}
.ends{margin-top:12px;border-radius:12px;padding:10px 12px;background:#f0fbf6;border:1.5px solid #bfe9d6;font:600 13.5px/1.35 Inter;color:#0f5c43;display:flex;gap:9px;align-items:center}
.lb{font:700 13px Inter;margin-top:14px;color:#334155}
.sz{display:flex;gap:8px;margin-top:8px}.sz div{width:52px;height:40px;border-radius:10px;border:1.5px solid #cbd5e1;display:grid;place-items:center;font:700 14px Inter}
.sz div.on{border-color:#0f1f4d;background:#0f1f4d;color:#fff}
.btn{position:absolute;left:18px;right:18px;bottom:24px;height:56px;border-radius:16px;background:#0f1f4d;color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px Inter;z-index:3}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
/* overlays */
.pin{position:absolute;display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);font:700 24px Inter;padding:10px 20px 10px 10px;border-radius:999px;box-shadow:0 16px 34px rgba(0,0,0,.3);white-space:nowrap}
.pin .d{width:26px;height:26px;border-radius:50%;background:#0ea472;box-shadow:0 0 0 5px rgba(14,164,114,.22)}
.pin.bad .d{background:#e5484d;box-shadow:0 0 0 5px rgba(229,72,77,.2)}
.pin.cal .d{background:#0f1f4d;box-shadow:0 0 0 5px rgba(15,31,77,.18)}
.hbox{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:20}
#chap{position:absolute;left:50%;top:190px;background:#fff;color:#0a1a47;font:800 22px Inter;letter-spacing:.16em;padding:12px 24px;border-radius:999px;transform-origin:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#cap{position:absolute;left:70px;right:70px;top:1335px;text-align:center;font:800 64px/1.12 "Inter Display";letter-spacing:-.035em;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.35)}
#cap .rw{display:inline-block;will-change:transform,opacity,filter}
#cap .hl{color:var(--mint)}
.hand{position:absolute;font:700 54px Hand;color:var(--mint);white-space:nowrap}
.bridge{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,26,71,.82);opacity:0;z-index:50}
.bridge .bt{font:900 96px/1.05 "Inter Display";letter-spacing:-.04em;color:#fff;text-align:center;padding:0 90px}
.bridge .bw{display:inline-block}.bridge .hl{color:#34d5a0}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;opacity:0;padding-bottom:180px}
.cta{background:var(--mint);color:#0a1a47;font:800 50px "Inter Display";letter-spacing:-.02em;padding:24px 28px 24px 50px;border-radius:999px;display:inline-flex;align-items:center;gap:26px;box-shadow:0 24px 50px rgba(52,213,160,.3)}
.cta i{width:70px;height:70px;border-radius:50%;background:#0a1a47;display:grid;place-items:center}

html,body{width:auto!important;height:auto!important;overflow:visible!important;background:#777}
.cv{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter";
 background:radial-gradient(700px 700px at 50% 62%,#1d4fa3 0%,rgba(29,79,163,0) 72%),radial-gradient(900px 700px at 100% 0%,#145466 0%,rgba(20,84,102,0) 70%),#0a1a47}
.cv .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.7px);background-size:36px 36px}
.logo{position:absolute;left:50%;top:330px;height:50px;transform:translateX(-50%)}
.hlc{position:absolute;left:90px;right:90px;top:430px;text-align:center;font:900 108px/.98 "Inter Display";letter-spacing:-.05em;color:#fff;text-transform:uppercase}
.hlc em{display:block;font-family:"Serif";font-style:italic;font-weight:400;text-transform:none;color:#34d5a0;font-size:1.05em;letter-spacing:-.01em}
.small{position:absolute;left:0;right:0;top:1545px;text-align:center;font:700 30px Inter;color:rgba(255,255,255,.85)}
.small b{color:#34d5a0}
.cphone{position:absolute;left:50%;top:840px;width:370px;height:760px;margin-left:-185px;border-radius:58px;background:#0b1020;padding:12px;box-shadow:0 60px 110px rgba(0,0,0,.55),0 0 0 2px #33406a,inset 0 0 0 2px #2b3448;transform-origin:50% 0;transform:scale(.88) rotate(-3deg)}
.cphone .view{position:absolute;inset:0}
.float{position:absolute;background:#fff;border-radius:26px;box-shadow:0 40px 80px rgba(0,0,0,.45);font-family:Inter;color:#0f172a}
</style></head><body>
<div id="cover" class="cv"><div class="dots"></div>
  <img class="logo" src="../assets/logo_white.png">
  <div class="hlc">Fake timer? <em>Customers notice.</em></div>

        <div class="nv"><i class="mi"></i>NOVA<svg class="bag" viewBox="0 0 24 24" fill="none" stroke="#0f1f4d" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg></div>

   <div style="font:800 96px/1 'Inter Display';letter-spacing:-.03em;color:#0f172a;margin-top:6px;font-variant-numeric:tabular-nums">09:59</div>
