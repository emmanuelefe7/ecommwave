<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>
#logo{left:80px;top:170px;height:46px}
#h1{left:80px;top:300px;width:940px;font-size:118px;color:#fff}
#h1 .serif{color:var(--mint);font-size:1.12em}
#br{left:70px;top:840px;width:940px;height:720px}
#scan{position:absolute;left:0;right:0;height:140px;background:linear-gradient(180deg,rgba(52,213,160,0) 0%,rgba(52,213,160,.22) 85%,rgba(52,213,160,.9) 100%);z-index:6;pointer-events:none}
.iss{position:absolute;z-index:8;background:#fff;border-radius:999px;padding:14px 26px 14px 14px;display:flex;align-items:center;gap:14px;font:700 27px "Inter";color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35);white-space:nowrap}
.iss .d{position:relative;width:40px;height:40px;border-radius:50%;background:#ff4d5e;display:grid;place-items:center;color:#fff;font:800 24px "Inter"}
.iss .d .ok{position:absolute;inset:0;border-radius:50%;background:var(--green);display:grid;place-items:center;opacity:0}
.iss .d .ok svg path{stroke:#fff}
#gauge{left:640px;top:640px;width:370px;background:#fff;border-radius:28px;padding:22px 26px;display:flex;gap:22px;align-items:center;box-shadow:0 30px 70px rgba(0,0,0,.35);z-index:9}
#gauge .lb{font:600 22px "Inter";color:#64748b}
#gauge .st{font:800 30px "Inter Display";letter-spacing:-.02em;margin-top:4px}
#gnum{font:800 40px "Inter Display";fill:#0f172a}
#end{opacity:0}
#e1{left:80px;top:250px;width:920px;font-size:112px;color:#fff;text-align:center}
#e1 .serif{color:var(--mint);font-size:1.12em}
#arch{left:290px;top:560px;width:500px;height:660px}
#arch .back{position:absolute;left:24px;top:24px;right:-24px;bottom:-24px;border-radius:250px 250px 36px 36px;background:var(--mint)}
#arch .ph{position:absolute;inset:0;border-radius:250px 250px 36px 36px;overflow:hidden;background:#d9e3ef}
#arch .ph img{position:absolute;left:50%;bottom:0;height:640px;transform:translateX(-50%)}
#c1{left:60px;top:740px}#c2{left:640px;top:960px}#c3{left:100px;top:1110px}
#cta{left:50%;top:1330px}
#url{left:0;right:0;top:1530px;text-align:center;color:#a9b8d6;font:600 36px "Inter"}
#elogo{left:50%;top:140px;height:46px;transform:translateX(-50%)}
</style></head><body><div id="stage">
<div class="scene bg-dark" id="main">
  <img id="logo" class="abs" src="assets/logo_white.png">
  <div id="h1" class="abs headline">Getting traffic<br>but <span class="serif">no sales?</span></div>
  <div id="br" class="browser"></div>
  <div id="gauge" class="abs"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#eef1f5" stroke-width="12" fill="none"/><circle id="garc" cx="60" cy="60" r="50" stroke="#ff4d5e" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><text id="gnum" x="60" y="74" text-anchor="middle">0</text></svg>
    <div><div class="lb">Store score</div><div class="st" id="gst" style="color:#ff4d5e">Needs work</div></div></div>
  <div class="iss" id="i1" style="left:520px;top:1045px"><span class="d">!<span class="ok">OK</span></span><span class="tx">Hero loads in 6.2s</span></div>
  <div class="iss" id="i2" style="left:100px;top:1170px"><span class="d">!<span class="ok">OK</span></span><span class="tx">Weak call to action</span></div>
  <div class="iss" id="i3" style="left:470px;top:1340px"><span class="d">!<span class="ok">OK</span></span><span class="tx">No reviews shown</span></div>
  <div class="iss" id="i4" style="left:590px;top:925px"><span class="d">!<span class="ok">OK</span></span><span class="tx">4-step checkout</span></div>
</div>
<div class="scene bg-dark" id="end">
  <img id="elogo" class="abs" src="assets/logo_white.png">
  <div id="e1" class="abs headline">Get your <span class="serif">free</span> store audit.</div>
  <div id="arch" class="abs"><div class="back"></div><div class="ph"><img src="assets/woman.png"></div></div>
  <div id="c1" class="abs chip"><span class="ck">CK</span>Speed check</div>
  <div id="c2" class="abs chip"><span class="ck">CK</span>Conversion review</div>
  <div id="c3" class="abs chip"><span class="ck">CK</span>SEO check</div>
  <div id="cta" class="abs cta">Request yours <span class="arrow">AR</span></div>
  <div id="url" class="abs">ecommwave.org</div>
</div>
</div>
<script>
document.body.innerHTML=document.body.innerHTML.replaceAll('>CK<','>'+CHECK+'<').replaceAll('>OK<','>'+CHECK+'<').replace('>AR<','>'+ARROW+'<');
$('#br').innerHTML=browserHTML('yourstore.com',novaHTML()+'<div id="scan"></div>',940,720);
const hw=splitWords($('#h1')), ew=splitWords($('#e1'));
const DUR=14.5;
function render(t){
  wordsIn(hw,t,.15,.08,.7);
  const bi=eo5(P(t,1.1,.9)); tf($('#br'),`translateY(${(1-bi)*260}px) scale(${lerp(.94,1,bi)*(1+.015*P(t,2,7))})`); op($('#br'),bi);
  // scan 2.0-3.6 (view h 662)
  const sc=eio(P(t,2.0,1.6)); const scan=$('#scan'); scan.style.top=(-140+sc*802)+'px'; op(scan,sc>0&&sc<1?1:0);
  // gauge
  const g=back(P(t,1.9,.6)); tf($('#gauge'),`scale(${g})`); op($('#gauge'),clamp(g));
  const fix=eio(P(t,5.6,1.6));
  const v=Math.round(lerp(0,42,eo(P(t,2.1,1.5)))+ (91-42)*fix);
  $('#gnum').textContent=v; $('#garc').style.strokeDashoffset=314.16*(1-v/100);
  const good=fix>.5; $('#garc').style.stroke=good?'#12b886':'#ff4d5e';
  const gs=$('#gst'); gs.textContent=good?'Optimized':'Needs work'; gs.style.color=good?'#12b886':'#ff4d5e';
  // issues pop during scan, then resolve
  const at=[2.4,2.8,3.2,3.5], fx=[5.4,5.8,6.2,6.6];
  ['#i1','#i2','#i3','#i4'].forEach((id,i)=>{const el=$(id); const x=back(P(t,at[i],.5)); tf(el,`scale(${x})`); op(el,clamp(x));
    const ok=el.querySelector('.ok'); const k=back(P(t,fx[i],.45)); op(ok,clamp(k*2)); tf(ok,`scale(${k})`);
    if(t>at[i]+.5 && t<fx[i]) el.querySelector('.d').style.boxShadow=`0 0 0 ${6+Math.sin((t-at[i])*6)*4}px rgba(255,77,94,.25)`; else el.querySelector('.d').style.boxShadow='none';
    el.querySelector('.tx').style.opacity= t>fx[i]+.2 ? .55 : 1;
    el.querySelector('.tx').style.textDecoration = t>fx[i]+.2 ? 'line-through' : 'none';
  });
  // headline swap at 4.6
  // exit 8.6
  const ex=eio(P(t,8.6,.6)); op($('#main'),1);  op($('#end'),ex);
  op($('#elogo'),eo(P(t,8.8,.6)));
  wordsIn(ew,t,8.9,.07,.7);
  const a=eo5(P(t,9.2,.9)); tf($('#arch'),`translateY(${(1-a)*140}px)`); op($('#arch'),a);
  $('#arch .ph img').style.transform=`translateX(-50%) scale(${1.06-.06*eo(P(t,9.2,4))})`;
  ['#c1','#c2','#c3'].forEach((id,i)=>{const x=back(P(t,9.9+i*.25,.55)); const fl=Math.sin(t*1.6+i*2)*6; tf($(id),`translateY(${fl}px) scale(${x})`); op($(id),clamp(x));});
  const cx2=back(P(t,10.8,.6)); tf($('#cta'),`translateX(-50%) scale(${cx2*(1+Math.sin(Math.max(0,t-11.6)*4)*.015)})`); op($('#cta'),clamp(cx2));
  $('#cta .arrow').style.transform=`translateX(${Math.max(0,Math.sin((t-11.6)*4))*8}px)`;
  op($('#url'),eo(P(t,11.1,.6)));
}
window.DUR=DUR; render(0);
</script></body></html>
