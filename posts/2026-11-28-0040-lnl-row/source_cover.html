<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../common.css">
<style>
/* Reel cover (NAVY) — L-N-L middle: save for later / wishlist */
html,body{width:auto!important;height:auto!important;overflow:visible!important;background:#777}
.cv{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter";
 background:radial-gradient(700px 700px at 50% 62%,#1d4fa3 0%,rgba(29,79,163,0) 72%),radial-gradient(900px 700px at 100% 0%,#145466 0%,rgba(20,84,102,0) 70%),#0a1a47}
.cv .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.7px);background-size:36px 36px}
.logo{position:absolute;left:50%;top:330px;height:50px;transform:translateX(-50%)}
.hl{position:absolute;left:90px;right:90px;top:430px;text-align:center;font:900 112px/.98 "Inter Display";letter-spacing:-.05em;color:#fff;text-transform:uppercase}
.hl em{display:block;font-family:"Serif";font-style:italic;font-weight:400;text-transform:none;color:#34d5a0;font-size:1.02em;letter-spacing:-.01em}
.small{position:absolute;left:0;right:0;top:1560px;text-align:center;font:700 30px Inter;color:rgba(255,255,255,.85)}
.small b{color:#34d5a0}
.phone{position:absolute;left:330px;top:760px;width:400px;height:680px;border-radius:64px;background:#0b1020;padding:13px;box-shadow:0 60px 110px rgba(0,0,0,.5),0 0 0 2px #33406a,inset 0 0 0 2px #2b3448;transform:rotate(-4deg)}
.scr{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff;color:#0f172a}
.isl{position:absolute;left:50%;top:12px;width:104px;height:30px;border-radius:16px;background:#000;transform:translateX(-50%)}
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 4px;font:600 16px Inter}
.nv{height:52px;display:flex;align-items:center;justify-content:center;font:800 20px "Inter Display";letter-spacing:.08em;color:#0f1f4d}
h4{font:800 28px "Inter Display";letter-spacing:-.02em;padding:6px 20px 0}
.sub{font:500 15px Inter;color:#64748b;padding:4px 20px 0}
.big{margin:12px 16px 0;height:250px;border-radius:20px;overflow:hidden;position:relative;background:#e9e0d4}
.hrt{position:absolute;right:12px;top:12px;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.row{display:flex;justify-content:space-between;padding:12px 20px 0;font:800 20px "Inter Display"}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 0}
.g2 .im{height:96px;border-radius:14px;overflow:hidden;position:relative;background:#eef1f5}
.g2 .im img{width:100%;height:100%;object-fit:cover}
.g2 b{display:block;font:700 14px Inter;margin-top:6px}
.badge{position:absolute;left:680px;top:790px;width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(8deg)}
.saved{position:absolute;left:140px;top:1350px;display:flex;align-items:center;gap:14px;background:#fff;color:#0d1b3e;font:800 32px "Inter Display";padding:14px 30px 14px 14px;border-radius:999px;box-shadow:0 24px 50px rgba(0,0,0,.45);transform:rotate(-3deg)}
.saved i{width:50px;height:50px;border-radius:50%;background:#34d5a0;display:grid;place-items:center}
</style></head><body>
<div id="cover" class="cv"><div class="dots"></div>
  <img class="logo" src="../assets/logo_white.png">
  <div class="hl">Not today? <em>Let them save it.</em></div>
  <div style="position:absolute;left:50%;top:860px;width:760px;height:700px;margin-left:-380px;border-radius:50%;background:radial-gradient(circle,rgba(52,213,160,.24),rgba(52,213,160,0) 70%)"></div>
  <!-- REAL-looking visual: a realistic phone on the NOVA wishlist with real product photos + a big saved heart -->
  <div class="phone"><div class="scr"><div class="isl"></div>
    <div class="sb"><span>9:41</span><span>●●● ▮</span></div><div class="nv">NOVA</div>
    <h4>Your wishlist</h4><div class="sub">3 saved items</div>
    <div class="big"><img src="../assets/hero_woman.png" style="position:absolute;right:-120px;top:0;height:100%">
      <div class="hrt"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" fill="#e5484d"/></svg></div></div>
    <div class="row"><span>Linen Wrap Dress</span><span>$75</span></div>
    <div class="g2"><div><div class="im"><img src="../assets/p_bag.png"></div><b>Tan Satchel · $129</b></div><div><div class="im"><img src="../assets/p_sneaker.png"></div><b>Court Sneaker · $89</b></div></div>
  </div></div>
  <div class="badge"><svg width="96" height="96" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" fill="#e5484d"/></svg></div>
  <div class="saved"><i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0a1a47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Saved for later</div>
  <div class="small">Watch: <b>turn “maybe later” into orders</b> · ecommwave.org</div>
</div>
</body></html>
